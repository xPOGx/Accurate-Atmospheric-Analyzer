[versions]
agp = "8.8.0"
datastore = "1.1.2"
firebaseBom = "33.8.0"
firebasePlugin = "4.4.2"
firebaseCrashPlugin = "3.0.2"
hiltAndroid = "2.51.1"
hiltCompiler = "2.51.1"
hiltNavigationCompose = "1.2.0"
kotlin = "2.0.10"
coreKtx = "1.15.0"
kotlinxSerializationJson = "1.7.1"
kotlinxSerializationJsonPlugin = "2.0.20"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.10.0"
composeBom = "2025.01.00"
daggerHilt = "2.51.1"
ksp = "2.0.10-1.0.24"
ktor = "2.3.9"
chucker = "4.0.0"
navigationCompose = "2.8.5"
protobufJavalite = "3.18.0"
room = "2.6.1"
secretsGradlePlugin = "2.0.1"
protobufPlugin = "0.9.4"
workManager = "2.10.0"
workStartup = "1.2.0"
workHilt = "1.2.0"

#build constants
applicationId = "mega.triple.aaa"
minSdk = "24"
targetSdk = "35"
compileSdk = "35"
javaVersion = "17"
versionCode = "1"
versionName = "0.0.1"
kotlinCompilerExtensionVersion = "1.5.1"
#projects
projectCommon = ":core-common"
projectDataNetwork = ":data-network"
projectDataProto = ":data-proto"

[libraries]
# Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hiltAndroid" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hiltCompiler" }

# Network
io-ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
io-ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
io-ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
io-ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
chucker = { module = "com.github.chuckerteam.chucker:library", version.ref = "chucker" }

#WorkManager
worker-lib = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
worker-startup = { group = "androidx.startup", name = "startup-runtime", version.ref = "workStartup" }
worker-hilt = { group = "androidx.hilt", name = "hilt-work", version.ref = "workHilt" }
worker-hiltCompiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "workHilt" }

# 3d party
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobufJavalite" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
jetbrains-kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinxSerializationJsonPlugin" }
secrets-gradle-plugin = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secretsGradlePlugin" }

dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "daggerHilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }

firebase = { id = "com.google.gms.google-services", version.ref = "firebasePlugin" }
firebase-crashlytic = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashPlugin" }

[bundles]
network = ["io-ktor-client-core", "io-ktor-client-okhttp", "io-ktor-client-content-negotiation", "io-ktor-serialization-json", "kotlinx-serialization-json", "chucker"]
